<!doctype html><html xmlns="http://www.w3.org/1999/xhtml"><head><title>Keynote</title><meta name="viewport" content="initial-scale=1,minimum-scale=1,width=device-width"/><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/></head><body id="body"><div id="stageArea"><div id="stage" class="stage"></div><div id="hyperlinkPlane" class="stage"></div></div><div id="slideshowNavigator"></div><div id="slideNumberControl"></div><div id="slideNumberDisplay"></div><div id="helpPlacard"></div><div id="waitingIndicator"><div id="waitingSpinner"></div></div><script src="assets/player/main.js"></script>
<!--
  Design principle (per user, 2026-07-23): DO NOT interfere with ANY of the
  deck's original functionality. Every baked-in hyperlink keeps working
  exactly as authored — the TOC cards on page #0 jump to their topics, the
  bottom-bar buttons work, keyboard works, the thumbnail navigator works.

  Only three things are changed/added, all additive:

  1. Tapping BLANK space (no hyperlink under the finger) no longer
     advances the deck. Implemented by wrapping UC.advanceToNextBuild
     (UC is the player's own global ShowController, created on window
     load) to ignore calls whose reason string is the tap/click fallback
     ("processClickOrTapAtDisplayCoOrds" / "onMouseDown"). Every other
     caller — swipes, keyboard, autoplay — passes through untouched.
     No DOM overlay blocks anything, so hyperlinks are never intercepted.

  2. VIRTUAL left/right 20% tap zones: a document-level pointer listener
     checks, using the player's own hyperlink hit-test, that the tap is on
     blank space; only then does a tap in the left/right 20% page-turn by
     exactly ONE page (#0..#7, native primitives: 1-finger-left-swipe =
     advanceToNextBuild, 2-finger-right-swipe = goBackToPreviousBuild).
     A tap on a hyperlink — even inside the 20% bands — is left entirely
     to the deck. Long-press anywhere opens the built-in navigator.

  3. slides/slide6_bar.jpg (QR closing card) replaces the blank end-of-show
     state (#8): reaching past the last real page (#7) by ANY means shows
     the card; next from the card reloads to #0 (loop), prev returns to #7.

  Position comes from location.hash (the player maintains it itself).
  The deck has exactly 8 real scenes (#0..#7), counted from the events
  arrays of the 5 slide JSONs; #8 is the player's blank end state.
  All styling is via JS inline styles: a static <style> tag at this point
  in the document parses to 0 CSS rules (verified on the live page).
-->
<div id="__closingCard"><img data-src="slides/slide6_bar.jpg" alt="想了解更多資訊請掃描 QR Code" draggable="false"></div>
<script>
(function(){
  var TOTAL_CONTENT_SCENES = 8;              // #0..#7
  var LAST_SCENE = TOTAL_CONTENT_SCENES - 1; // 7
  var NAV_COOLDOWN_MS = 350; // short enough that quick consecutive controls stay responsive
  var ZONE_FRACTION = 0.2;

  function applyStyles(el, styles){ for (var p in styles){ el.style[p] = styles[p]; } }
  function scene(){ var m = (location.hash || '').match(/\d+/); return m ? +m[0] : 0; }

  // ---- background -------------------------------------------------------
  [document.documentElement, document.body, document.getElementById('stageArea')].forEach(function(el){
    if (el){
      el.style.setProperty('background-color', '#EDF7F9', 'important');
      el.style.setProperty('height', '100%', 'important');
      // 'manipulation' keeps pinch-zoom fully native but disables Safari's
      // double-tap smart zoom — required so double-tap can open the
      // navigator without also zooming the page.
      el.style.setProperty('touch-action', 'manipulation', 'important');
    }
  });

  // The player's own dark spinner box is never shown — the loading screen
  // is the only loading UI (it now also waits for the first slide to be
  // rendered, so the spinner would only ever overlap the tutorial).
  var __wi = document.getElementById('waitingIndicator');
  if (__wi){
    __wi.style.setProperty('display', 'none', 'important');
    new MutationObserver(function(){
      if (__wi.style.display !== 'none') __wi.style.display = 'none';
    }).observe(__wi, { attributes:true, attributeFilter:['style'] });
  }

  // NOTE: the "tap on blank space advances one build" fallback is disabled
  // directly inside assets/player/main.js (two surgical string edits at the
  // processClickOrTapAtDisplayCoOrds / onMouseDown call sites), because the
  // player's controller lives in a closure and can't be patched from here.
  // main.js also now exposes the controller as window.__UC so we can reuse
  // its own hyperlink hit-test below. Nothing else in main.js is touched.

  // Player's own hit-test: is there a hyperlink at this display coord?
  function hyperlinkAt(x, y){
    try {
      var sc = window.__UC;
      if (!sc || !sc.displayManager) return null;
      var show = sc.displayManager.convertDisplayCoOrdsToShowCoOrds({ pointX:x, pointY:y });
      if (!show || show.pointX === -1) return null;
      return sc.findHyperlinkAtCoOrds(show) || null;
    } catch(e){ return null; }
  }

  function navigatorIsOpen(){
    var sb = document.querySelector('.navigatorThumbnailSidebar');
    if (!sb) return false;
    var l = parseFloat(getComputedStyle(sb).left);
    return isFinite(l) && l > -50;
  }

  function hideNavigator(){
    try {
      var sc = window.__UC;
      sc.navigatorController.thumbnailSidebar.hide(sc.navigatorController.leftSidebar);
      return;
    } catch(e){}
    fireSwipe('left', 1, 50); // player's own "left swipe near edge = hide sidebar"
  }

  // Auto-close the thumbnail navigator after picking a slide. Touch has no
  // mouseleave, so the player's only auto-hide path never fires on iPad.
  // Covered twice: a tap on any thumbnail (walk up the DOM for the
  // slideNumber the player stamps on it), and any hash change while the
  // navigator is open (jump landed).
  document.getElementById('slideshowNavigator').addEventListener('click', function(e){
    var t = e.target;
    while (t && t !== document.body && (t.slideNumber === undefined || t.slideNumber === null)) t = t.parentNode;
    if (t && t.slideNumber !== undefined && t.slideNumber !== null) setTimeout(hideNavigator, 200);
  });

  // ---- native one-page primitives ---------------------------------------
  function fireSwipe(direction, fingers, swipeStartX){
    document.dispatchEvent(new CustomEvent('TouchController:SwipeEvent', {
      // synthetic:true lets the __onNativeSwipe hook in main.js tell OUR
      // events (pass straight to the player) apart from REAL finger swipes
      // (normalized below so they can never cross the last-page boundary).
      detail: { direction: direction, fingers: fingers, swipeStartX: swipeStartX, synthetic: true }
    }));
  }
  // NOTE (fixing the 7/27 rewrite): main.js does NOT block
  // advanceToNextBuild for all callers — only the two blank-tap reasons
  // ("processClickOrTapAtDisplayCoOrds"/"onMouseDown") are no-op'd; the
  // swipe path is intact (verified against the deployed main.js). The
  // bar-hyperlink coordinate scan this replaced silently failed on phone
  // viewports, which is why forward navigation died on mobile.
  function nextPage(){ fireSwipe('left', 1, 9999); }   // advanceToNextBuild
  function prevPage(){ fireSwipe('right', 2, 9999); }  // goBackToPreviousBuild
  var navOpenedAt = 0;
  function showNavigator(){ navOpenedAt = Date.now(); fireSwipe('right', 1, 50); }

  // ---- 3. closing card (replaces blank #8) ------------------------------
  var closingCard = document.getElementById('__closingCard');
  var closingImg  = closingCard.querySelector('img');
  applyStyles(closingCard, {
    position:'fixed', top:'0', left:'0', right:'0', bottom:'0', zIndex:'9000',
    background:'#EDF7F9', display:'none', alignItems:'center', justifyContent:'center',
    touchAction:'manipulation' /* allows pinch-zoom + pan; only kills the 300ms double-tap delay */
  });
  applyStyles(closingImg, {
    maxWidth:'100%', maxHeight:'100%', width:'auto', height:'auto',
    display:'block', webkitUserDrag:'none', userSelect:'none'
  });
  // touchstart: stopPropagation but passive (no preventDefault) so pointer events fire for tap zones
  var csX = 0, csY = 0;
  closingCard.addEventListener('touchstart', function(e){
    e.stopPropagation();
    if (e.touches && e.touches.length === 1){ csX = e.touches[0].clientX; csY = e.touches[0].clientY; }
  }, { passive: true });
  closingCard.addEventListener('touchmove', function(e){
    e.stopPropagation();
    if (!(e.touches && e.touches.length > 1)) e.preventDefault();
  }, { passive: false });
  closingCard.addEventListener('touchend', function(e){
    e.stopPropagation();
    if (!(e.touches && e.touches.length > 1)) e.preventDefault();
    // Horizontal swipe navigation from the closing card
    if (e.changedTouches && e.changedTouches.length === 1){
      var dx = e.changedTouches[0].clientX - csX;
      var dy = e.changedTouches[0].clientY - csY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)){
        tapNav(dx > 0 ? goPrev : goNext);
      }
    }
  }, { passive: false });
  ['touchcancel','mousedown','mouseup','click'].forEach(function(evt){
    closingCard.addEventListener(evt, function(e){
      e.stopPropagation();
      if (!(e.touches && e.touches.length > 1)) e.preventDefault();
    }, { passive: false });
  });

  var onCard = false;
  var pendingCardJump = false; // set when the sidebar's 6th thumbnail is tapped
  var pendingShowCard = false; // 150ms guard against flash when going backward past closing card
  // The card image carries data-src instead of src so that it does not
  // download alongside the first page's gifs; it is fetched as soon as the
  // gate opens (warmRestInBackground), and on demand if the user somehow
  // gets here first.
  function ensureCardImg(){
    if (!closingImg.getAttribute('src')){
      closingImg.src = closingImg.getAttribute('data-src') || 'slides/slide6_bar.jpg';
    }
  }
  function showCard(){ ensureCardImg(); onCard = true; closingCard.style.display = 'flex'; }
  function hideCard(){ onCard = false; closingCard.style.display = 'none'; }

  function goNext(){
    if (onCard){
      location.replace(location.pathname + location.search); // loop to #0
      return;
    }
    var cur = scene();
    if (cur >= LAST_SCENE){ showCard(); return; }
    nextPage();
    console.log('[nav] goNext cur=' + cur + ' target=' + (cur + 1));
  }
  function goPrev(){
    if (onCard){
      if (scene() > LAST_SCENE) prevPage(); // pull back out of the blank end state
      hideCard();
      return;
    }
    var cur = scene();
    if (cur <= 0) return;
    prevPage();
    console.log('[nav] goPrev cur=' + cur + ' target=' + (cur - 1));
  }

  // Reaching past #7 by ANY means (our zones, bottom-bar buttons, keyboard)
  // shows the card instead of the blank end state; jumping back via the
  // navigator hides it.
  // IMPORTANT: the player updates the URL hash via history.replaceState,
  // which NEVER fires a hashchange event — every hashchange listener we
  // had was dead code (why gif restart "worked" going forward — that was
  // the player natively creating a fresh <img> — but never going back).
  // A 200ms poll on scene() is the only reliable page-change signal.
  function onSceneChanged(s){
    console.log('[nav] scene ->', s);
    // pendingShowCard: 150ms guard prevents false-positive card flash
    // when navigating backward through the blank end state briefly
    if (s > LAST_SCENE){
      if (!onCard && !pendingShowCard){
        pendingShowCard = true;
        setTimeout(function(){
          pendingShowCard = false;
          if (scene() > LAST_SCENE && !onCard) showCard();
        }, 150);
      }
    }
    else {
      pendingShowCard = false;
      if (pendingCardJump && s === LAST_SCENE){ pendingCardJump = false; showCard(); }
      else if (onCard){ hideCard(); }
    }
    // a jump landed while the sidebar was open (thumbnail tap): close it
    if (navigatorIsOpen()) hideNavigator();

    // Visible gifs: ping-pong restart (fresh decoder -> frame 0).
    if (s <= LAST_SCENE){
      setTimeout(function(){ gifRestartNav(); }, 450);
    }
    // MEASURED live on this deck (2026-08-03): the gif pages are #2/#6
    // arriving FORWARD, but the same visual pages arrive as #1/#5 going
    // backward or via the sidebar — and on those arrivals the player
    // REMOVES the gif <img> from the DOM entirely (verified: 0 elements).
    // No src-reset can fix a missing element. The only path that recreates
    // it is a real forward build (verified live: #5 -> prev(#4) -> next(#6)
    // = both gifs back and playing). So when we land on a gif page and no
    // gif element exists, silently re-enter it forward: one page back,
    // then one forward.
    if (GIF_PAGES[s] && !onCard){
      setTimeout(function(){ maybeNudgeForGif(s); }, 700);
    }
  }
  var GIF_PAGES = { 0:1, 1:1, 2:1, 3:1, 6:1, 7:1 };
  var gifNudging = false;
  function visibleGifCount(){
    var n = 0, imgs = document.querySelectorAll('img');
    for (var i = 0; i < imgs.length; i++){
      var im = imgs[i];
      if (im.src && im.src.indexOf('.gif') > -1 && im.offsetWidth > 0) n++;
    }
    return n;
  }
  function maybeNudgeForGif(s){
    if (scene() !== s || onCard) return;                 // already moved on
    if (document.getElementById('__preload') || document.getElementById('__tutorial')) return;
    if (visibleGifCount() > 0){                          // element exists — fine
      try { sessionStorage.removeItem('__gifReload0'); } catch(e){}  // gifs are alive again
      return;
    }
    // A gif that is in the DOM but still downloading has offsetWidth 0 and
    // would look "missing" — since later pages' gifs now load in the
    // background, wait for it instead of re-entering the page.
    var loading = false, all0 = document.querySelectorAll('img');
    for (var q = 0; q < all0.length; q++){
      var i0 = all0[q];
      if (i0.src && i0.src.indexOf('.gif') > -1 && !i0.complete){ loading = true; break; }
    }
    if (loading){
      console.log('[gif] still downloading at #' + s + ' — waiting instead of nudging');
      setTimeout(function(){ maybeNudgeForGif(s); }, 1200);
      return;
    }
    if (gifNudging){ console.log('[gif] nudge already ran, still no gif at #' + s); return; }
    gifNudging = true;
    // THIS DECK: scene #0 is itself a gif page (slide 1 carries the three
    // PRK / LASIK / SMILE gifs), so the usual "one page back, then one
    // forward" re-entry has nowhere to go back to. A fresh load always
    // renders #0 as a forward build, so that is the only recovery — capped
    // at one reload per session so a permanently missing gif can't loop.
    if (s === 0){
      var used = false;
      try { used = sessionStorage.getItem('__gifReload0') === '1'; } catch(e){}
      if (used){
        console.log('[gif] no gif at #0, reload already used this session');
        setTimeout(function(){ gifNudging = false; }, 2000);   // never leave the latch stuck
        return;
      }
      try { sessionStorage.setItem('__gifReload0', '1'); } catch(e){}
      console.log('[gif] no gif element at #0 -> reloading to re-enter forward');
      location.replace(location.pathname + location.search);
      return;
    }
    console.log('[gif] no gif element at #' + s + ' -> re-entering forward (back+next)');
    prevPage();
    setTimeout(function(){
      nextPage();
      setTimeout(function(){ gifNudging = false; }, 2000);
    }, 1000);
  }

  // ---- GIF restart on navigation ----------------------------------------
  //  * whole-document img search (NOT limited to #stageArea — measured:
  //    the gif imgs can live outside it)
  //  * visibility = offsetWidth/Height > 0 AND computed display/visibility
  //    (more reliable than offsetParent)
  //  * iOS Safari root cause: the GIF decoder is keyed per src URL.
  //    Setting src back to the SAME URL (even after a blank intermediate)
  //    makes iOS reuse the cached decoder and resume from the last frame.
  //    The ONLY reliable fix: always switch to a DIFFERENT URL so iOS is
  //    forced to create a new decoder and start from frame 0.
  //  * Strategy: ping-pong between base URL and base+'?r=1'.
  //    Both are pre-warmed in the background after the gate opens, so
  //    neither causes a network round-trip during navigation.
  //  * Retry once (at 350 ms) only if the first attempt found no visible GIF —
  //    this covers the case where the player's transition hasn't finished yet.
  var gifRestartTimer = null;
  function gifRestartNav(doneCb){
    if (gifRestartTimer) clearTimeout(gifRestartTimer);
    gifRestartTimer = setTimeout(function(){
      // Backward/jump arrivals leave the current page's gif <img> HIDDEN
      // (the player only reveals it during a forward build) — that is why
      // prev/sidebar navigation showed no animation. Recovery is scoped
      // STRICTLY to the gifs that belong to the current scene (GIF_KEYS
      // filename match), so no other slide's cached layer can ever be
      // un-hidden (the old double-layer bug).
      var s = scene();
      var wanted = GIF_KEYS[s] || [];
      var sa = document.getElementById('stageArea');
      var all = document.querySelectorAll('img');
      var restarted = 0;
      function swap(img){
        var base = img.src.replace(/[?#].*$/, '');
        var useAlt = img.src.indexOf('?r=1') < 0;
        img.src = useAlt ? (base + '?r=1') : base;
        restarted++;
        console.log('[gif] restart ->', useAlt ? '?r=1' : 'base', base.split('/').pop());
      }
      for (var i = 0; i < all.length; i++){
        var img = all[i];
        if (!img.src || img.src.indexOf('.gif') === -1) continue;
        // never interrupt a gif still loading its first play
        if (!img.complete || img.naturalWidth === 0) continue;
        var cst = getComputedStyle(img);
        var visible = img.offsetWidth > 0 && img.offsetHeight > 0 &&
                      cst.display !== 'none' && cst.visibility !== 'hidden';
        if (visible){
          swap(img);
        } else if (wanted.length && keyFor(img.src) && wanted.indexOf(keyFor(img.src)) !== -1){
          // current page's own gif, parked hidden: un-hide ITS chain only
          var n = img, unhid = 0;
          while (n && n !== sa && n !== document.body){
            if (n.style){
              if (n.style.display === 'none'){ n.style.display = ''; unhid++; }
              if (n.style.visibility === 'hidden'){ n.style.visibility = 'visible'; unhid++; }
              if (n.style.opacity === '0'){ n.style.opacity = '1'; unhid++; }
            }
            n = n.parentNode;
          }
          console.log('[gif] recovered hidden gif, unhid=' + unhid);
          swap(img);
        }
      }
      if (doneCb) doneCb(restarted);
      console.log('[gif] total restarted:', restarted, 'scene:', s);
    }, 0);
  }
  var GIF_KEYS = {
    0:['P2-PRK','P3-LASIK','P4-SMILE'], 1:['P2-PRK','P3-LASIK','P4-SMILE'],
    2:['P3-眼球吸附'],                  3:['P3-眼球吸附'],
    6:['P4-近視','P5-近視'],            7:['P4-近視','P5-近視']
  };
  // Keys must not be substrings of one another (keyFor returns the FIRST
  // match): '穩定恢復期' would also match '不穩定恢復期', so the P4-/P5-
  // filename prefixes are used instead.
  var KEY_LIST = ['P2-PRK', 'P3-LASIK', 'P4-SMILE', 'P3-眼球吸附', 'P4-近視', 'P5-近視'];
  function keyFor(src){
    var s = src;
    try { s = decodeURIComponent(src); } catch(e){}
    for (var i = 0; i < KEY_LIST.length; i++){
      if (s.indexOf(KEY_LIST[i]) !== -1) return KEY_LIST[i];
    }
    return null;
  }
  window.addEventListener('hashchange', function(){});
  var __lastScene = scene();
  setInterval(function(){
    var s = scene();
    if (s !== __lastScene){ __lastScene = s; onSceneChanged(s); }
  }, 200);


  // Real finger swipes (left/right) are normalized to the same one-page
  // logic as the tap zones — previously they fed the player's raw
  // advance/back directly, so a left-swipe on the last page (#7) sailed
  // past the boundary into the blank end state. Returning true swallows
  // the native handling. Our own synthetic events pass through untouched,
  // and swipes while the navigator is open keep their native meaning
  // (swipe-to-close).
  window.__onNativeSwipe = function(detail){
    if (!detail || detail.synthetic) return false;
    if (detail.direction !== 'left' && detail.direction !== 'right') return false;
    if (navigatorIsOpen()) return false;
    if (document.getElementById('__preload') || document.getElementById('__tutorial')) return true;
    if (navLocked) return true;
    navLocked = true;
    setTimeout(function(){ navLocked = false; }, NAV_COOLDOWN_MS);
    if (detail.direction === 'left') goNext(); else goPrev();
    return true;
  };

  // ---- 2. virtual tap zones + DOUBLE-TAP navigator (blocks nothing) -----
  // Single tap, left/right 20%, blank space  -> page turn (one page).
  // DOUBLE tap on blank space in the middle  -> open thumbnail navigator.
  //   (long-press removed per spec; Safari's own double-tap smart zoom is
  //    disabled via touch-action:manipulation above, pinch still native.)
  // Taps on the deck's own hyperlinks/buttons are always left to the deck.
  var navLocked = false;
  var lastTapTime = 0, lastTapX = 0, lastTapY = 0;
  function tapNav(fn){
    if (navLocked) return;
    navLocked = true;
    setTimeout(function(){ navLocked = false; }, NAV_COOLDOWN_MS);
    fn();
  }
  function handleTap(x, y){
    // Zones are measured against the SLIDE IMAGE (stage rect), not the
    // screen: left/right 20% OF THE IMAGE page-turns; any tap fully
    // OUTSIDE the image (letterbox margins) page-turns by which half of
    // the image it falls on — so the margins are one big prev/next button.
    var inLeft = false, inRight = false, outsideImage = false;
    var st = document.getElementById('stage');
    var sr = st ? st.getBoundingClientRect() : null;
    if (sr && sr.width > 0){
      if (x < sr.left || x > sr.right || y < sr.top || y > sr.bottom){
        outsideImage = true;
        inLeft  = x < sr.left + sr.width / 2;
        inRight = !inLeft;
      } else {
        var fxZone = (x - sr.left) / sr.width;
        inLeft  = fxZone < ZONE_FRACTION;
        inRight = fxZone > 1 - ZONE_FRACTION;
      }
    } else {
      var w = window.innerWidth;
      inLeft  = x < w * ZONE_FRACTION;
      inRight = x > w * (1 - ZONE_FRACTION);
    }
    if (document.getElementById('__preload')) return;  // still loading
    if (document.getElementById('__tutorial')) return; // tutorial owns taps
    if (onCard){
      // the card's baked-in bottom bar: map its ◀ 🏠 ▶ to real actions
      var cr = closingImg.getBoundingClientRect();
      var inImg = x >= cr.left && x <= cr.right && y >= cr.top && y <= cr.bottom;
      if (inImg && y > cr.bottom - cr.height * 0.055){
        var fx = (x - cr.left) / cr.width;
        if (fx > 0.28 && fx < 0.335){ tapNav(goPrev); return; }  // ◀ back to the last slide
        if (fx >= 0.335 && fx < 0.40){ tapNav(goNext); return; } // 🏠 restart from the first slide
        if (fx > 0.62 && fx < 0.70){ tapNav(goNext); return; }   // ▶ loop to the first slide
        return;
      }
      if (inLeft || inRight){
        tapNav(inLeft ? goPrev : goNext);
      }
      return;
    }
    if (navigatorIsOpen()){
      // tapping anywhere OUTSIDE the sidebar closes it — but not within
      // 600ms of opening (iOS fires trailing compat events for the very
      // double-tap that opened it, which was closing it immediately)
      if (Date.now() - navOpenedAt < 600) return;
      var sb = document.querySelector('.navigatorThumbnailSidebar');
      if (sb){
        var r = sb.getBoundingClientRect();
        var inside = x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        if (!inside) hideNavigator();
      }
      return;
    }
    // Letterbox margins: big prev/next buttons, no hyperlinks out there.
    if (outsideImage){
      if (inLeft || inRight) tapNav(inLeft ? goPrev : goNext);
      return;
    }
    // LAST Keynote page: the bar's ▶ hyperlink has no native next slide to
    // go to (our closing card isn't a Keynote slide), so the player just
    // swallows the tap. Route that arrow directly to the card, bypassing
    // the player's boundary check. Checked BEFORE the hyperlink pass-through.
    if (scene() >= LAST_SCENE){
      var st = document.getElementById('stage');
      if (st){
        var sr = st.getBoundingClientRect();
        if (y > sr.bottom - sr.height * 0.06 && y <= sr.bottom + 4){
          var fxBar = (x - sr.left) / sr.width;
          if (fxBar > 0.94){
            console.log('[nav] last-page bar ▶ -> closing card');
            tapNav(goNext); // goNext on LAST_SCENE shows the card
            return;
          }
        }
      }
    }
    if (hyperlinkAt(x, y)){
      // deck's own button (bar arrows/home, TOC cards): native handles it.
      // Our nav lock never applies to these — they are processed by the
      // player directly, and nothing of ours overlays them.
      console.log('[nav] tap on native hyperlink at', Math.round(x) + ',' + Math.round(y));
      lastTapTime = 0;
      return;
    }
    if (inLeft || inRight){
      lastTapTime = 0;                          // zone taps never count toward double-tap
      tapNav(inLeft ? goPrev : goNext);
      return;
    }
    // middle blank space: detect double-tap (450ms / 80px tolerance —
    // loosened so real-world double-taps register reliably on phones)
    var now = Date.now();
    if (now - lastTapTime < 450 && Math.abs(x - lastTapX) < 80 && Math.abs(y - lastTapY) < 80){
      lastTapTime = 0;
      showNavigator();
    } else {
      lastTapTime = now; lastTapX = x; lastTapY = y;
    }
  }

  // Multi-touch (pinch-to-zoom) must never be mistaken for a tap: the
  // moment a second finger lands the whole gesture is flagged so pointerup
  // does nothing. No preventDefault anywhere — pinch stays fully native.
  // pInMargin: pointer started outside the stage (in the empty side margins)
  // — those areas are NOT intercepted by the Keynote player, so we handle
  // both taps (already routed via handleTap's ZONE_FRACTION check) and
  // horizontal swipes here directly.
  var pDown = false, pMoved = false, pX = 0, pY = 0, multiTouch = false, pInMargin = false;
  // lastTouchTapTs: set by touchend so pointerup can skip on touch devices
  // (avoids double-firing handleTap when both events synthesize on the same tap)
  var lastTouchTapTs = 0;
  document.addEventListener('pointerdown', function(e){
    if (!e.isPrimary){ multiTouch = true; pInMargin = false; return; }
    multiTouch = false;
    pDown = true; pMoved = false; pX = e.clientX; pY = e.clientY;
    var st = document.getElementById('stage');
    if (st){
      var sr = st.getBoundingClientRect();
      pInMargin = (e.clientX < sr.left - 2 || e.clientX > sr.right + 2);
    } else { pInMargin = false; }
  }, { capture:true });
  document.addEventListener('pointermove', function(e){
    if (!pDown || !e.isPrimary) return;
    if (Math.abs(e.clientX-pX) > 12 || Math.abs(e.clientY-pY) > 12) pMoved = true;
  }, { capture:true });
  document.addEventListener('pointerup', function(e){
    if (e.isPrimary && pDown && !multiTouch){
      if (!pMoved){
        // Skip if touchend already handled this exact tap (<300ms ago).
        // On iOS Safari, touchend fires first; pointerup may synthesize
        // after, and we don't want to call handleTap twice.
        if (Date.now() - lastTouchTapTs > 300){
          handleTap(e.clientX, e.clientY);
        }
      } else if (pInMargin){
        // Swipe that started in the side margin — player never sees these
        var dx = e.clientX - pX;
        var dy = e.clientY - pY;
        if (Math.abs(dx) >= 40 && Math.abs(dx) > Math.abs(dy)){
          if (navigatorIsOpen()){ hideNavigator(); }
          else if (!navLocked && !document.getElementById('__preload') && !document.getElementById('__tutorial')){
            navLocked = true;
            setTimeout(function(){ navLocked = false; }, NAV_COOLDOWN_MS);
            if (dx < 0) goNext(); else goPrev();
          }
        }
      }
    }
    if (e.isPrimary) pDown = false;
  }, { capture:true });
  document.addEventListener('pointercancel', function(e){
    if (e.isPrimary) pDown = false;
  }, { capture:true });
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  // ---- iOS Safari touch fallback for zone taps ------------------------------
  // On iOS Safari the Keynote player calls preventDefault() on touchstart,
  // which suppresses subsequent synthesized pointerup events. This means
  // pointerup never fires and left/right zone taps are silently dropped.
  // Fix: duplicate tap detection via touchend (a native touch event that
  // always fires regardless of preventDefault). The lastTouchTapTs guard
  // above prevents pointerup from double-firing on browsers where both events
  // fire (e.g. Chrome/Android: touchend fires first, then pointerup).
  var tTX = 0, tTY = 0, tTMoved = false;
  document.addEventListener('touchstart', function(e){
    if (e.touches.length > 1){ tTMoved = true; return; }
    tTX = e.touches[0].clientX; tTY = e.touches[0].clientY; tTMoved = false;
  }, { capture: true, passive: true });
  document.addEventListener('touchmove', function(e){
    if (e.touches.length !== 1){ tTMoved = true; return; }
    var t = e.touches[0];
    if (Math.abs(t.clientX - tTX) > 12 || Math.abs(t.clientY - tTY) > 12) tTMoved = true;
  }, { capture: true, passive: true });
  document.addEventListener('touchend', function(e){
    if (tTMoved || multiTouch) return;
    if (e.changedTouches.length !== 1) return;
    lastTouchTapTs = Date.now();
    handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { capture: true });

  // ---- gif replay on every (re)entry ------------------------------------
  // The gif files themselves loop forever (NETSCAPE loop=0, verified), but
  // the player keeps each gif's <img> element around after leaving the
  // slide — coming back showed the element frozen/hidden over the PDF's
  // static frame. On every arrival at a gif page, re-assigning src forces
  // the browser to restart the gif from frame 0, and visibility is forced
  // back on. Run twice (short + long delay) because the element may be
  // (re)created a moment after the transition lands.
  // (GIF replay lives in onSceneChanged — the single trigger point that
  //  every navigation path passes through. No other gif code exists.)

  // ---- first-run tutorial (once per device, localStorage) ---------------
  var TUTORIAL_KEY = 'mfy_laser_tutorial_seen';   // per deck: localStorage is shared across the whole github.io origin
  function maybeShowTutorial(){
    try { if (localStorage.getItem(TUTORIAL_KEY)) return; } catch(e){}
    var tut = document.createElement('div');
    tut.id = '__tutorial';
    applyStyles(tut, {
      position:'fixed', top:'0', left:'0', right:'0', bottom:'0', zIndex:'60000',
      background:'rgba(18,38,54,0.82)', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', color:'#fff',
      fontFamily:'-apple-system, "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif',
      textAlign:'center'
    });
    // Icons are inline SVG on purpose: the Google Material Icons webfont used
    // to be linked from <head>, and when fonts.googleapis.com was slow or
    // blocked the ligature names ("chevron_left", "touch_app") rendered as
    // literal text. Nothing here is fetched from the network.
    var ICONS = {
      left:  '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 L8 12 L15 19"/></svg>',
      right: '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 L16 12 L9 19"/></svg>',
      tap:   '<svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4" fill="currentColor" stroke="none"/><path d="M6.6 6.6a7.6 7.6 0 0 0 0 10.8"/><path d="M17.4 6.6a7.6 7.6 0 0 1 0 10.8"/><path d="M3.6 3.6a11.9 11.9 0 0 0 0 16.8" opacity=".5"/><path d="M20.4 3.6a11.9 11.9 0 0 1 0 16.8" opacity=".5"/></svg>'
    };
    function item(iconKey, title, sub){
      var d = document.createElement('div');
      applyStyles(d, { margin:'0 34px', display:'flex', flexDirection:'column', alignItems:'center' });
      var i = document.createElement('span');
      i.innerHTML = ICONS[iconKey] || '';
      applyStyles(i, { display:'block', lineHeight:'0', marginBottom:'14px' });
      var t = document.createElement('div');
      t.textContent = title;
      applyStyles(t, { fontSize:'20px', fontWeight:'700', marginBottom:'6px' });
      var s = document.createElement('div');
      s.textContent = sub;
      applyStyles(s, { fontSize:'15px', opacity:'0.85' });
      d.appendChild(i); d.appendChild(t); d.appendChild(s);
      return d;
    }
    var row = document.createElement('div');
    applyStyles(row, { display:'flex', flexDirection:'row', alignItems:'flex-start', marginBottom:'44px' });
    row.appendChild(item('left',  '點左側', '上一頁'));
    row.appendChild(item('tap',   '雙擊中間', '開啟目錄'));
    row.appendChild(item('right', '點右側', '下一頁'));
    var hint = document.createElement('div');
    hint.textContent = '點任意處開始';
    applyStyles(hint, {
      fontSize:'16px', padding:'12px 30px', borderRadius:'999px',
      border:'1px solid rgba(255,255,255,0.6)'
    });
    tut.appendChild(row); tut.appendChild(hint);
    // dismiss on any tap; never let the tap reach the deck below
    ['pointerup','click','touchend'].forEach(function(evt){
      tut.addEventListener(evt, function(e){
        e.preventDefault(); e.stopPropagation();
        try { localStorage.setItem(TUTORIAL_KEY, '1'); } catch(err){}
        tut.style.transition = 'opacity .25s ease';
        tut.style.opacity = '0';
        setTimeout(function(){ tut.parentNode && tut.parentNode.removeChild(tut); }, 270);
      }, { passive:false });
    });
    document.body.appendChild(tut);
  }

  // ---- add the missing 6th (closing card) thumbnail to the sidebar ------
  // The sidebar is built by the player from its 5 native slides; our card
  // isn't one of them, so we append a 7th item that mimics the others.
  // Tapping it jumps the deck to the last slide and lays the card on top
  // (pendingCardJump defers showCard until the jump's hashchange lands, so
  // the hashchange handler doesn't immediately hide it again).
  // Poll continuously — the player may rebuild the sidebar on open/close.
  function goToCardFromSidebar(){
    hideNavigator();
    if (scene() === LAST_SCENE){ showCard(); return; }
    pendingCardJump = true;
    try { window.__UC.navigatorController.select(5); } // slide 5 = scene #7
    catch(e){ pendingCardJump = false; showCard(); }
    // fallback if no hashchange arrives (e.g. select silently failed)
    setTimeout(function(){
      if (pendingCardJump){ pendingCardJump = false; showCard(); }
    }, 1200);
  }
  function addCardThumb(){
    var sb = document.querySelector('.navigatorThumbnailSidebar');
    if (!sb || sb.querySelector('.__cardThumb')) return;
    var items = sb.querySelectorAll('.navigatorThumbnailItem');
    if (!items.length) return;
    var last = items[items.length - 1];
    var clone = last.cloneNode(true); // no listeners / no slideNumber props copied
    clone.classList.add('__cardThumb');
    // Fix positioning: if items are absolutely positioned, the clone inherits
    // the 6th item's top value and overlaps it (making slide 6 "disappear").
    // Move the clone down by exactly one item height so it sits below slide 6.
    // Make the sidebar NATIVELY TOUCH-SCROLLABLE instead of expanding it
    // beyond the viewport (which left later thumbnails unreachable on
    // phones — the player's own scroller is mouse-wheel only).
    if (window.getComputedStyle(last).position === 'absolute'){
      var itemH = last.offsetHeight;
      clone.style.top  = (last.offsetTop  + itemH) + 'px';
      clone.style.left = last.offsetLeft + 'px';
      // give the scroll container enough content height for all 7 items
      var needed = last.offsetTop + itemH * 2 + 4;
      var p = last.parentNode;
      if (p && p !== sb){ p.style.minHeight = needed + 'px'; }
    }
    sb.style.overflowY = 'auto';
    sb.style.overflowX = 'hidden';
    sb.style.webkitOverflowScrolling = 'touch';
    sb.style.touchAction = 'pan-y';
    // swap thumbnail image + slide number label
    var img = clone.querySelector('img');
    if (img){ img.removeAttribute('id'); img.removeAttribute('data-src'); img.src = 'slides/slide6_bar.jpg'; }
    clone.querySelectorAll('*').forEach(function(el){
      if (el.children.length === 0 && el.textContent.trim() === String(items.length)){
        el.textContent = String(items.length + 1);
      }
    });
    ['pointerup','click','touchend'].forEach(function(evt){
      clone.addEventListener(evt, function(e){
        e.preventDefault(); e.stopPropagation();
        goToCardFromSidebar();
      }, { passive:false });
    });
    last.parentNode.appendChild(clone);
  }
  // Poll continuously — sidebar may be rebuilt on open/close; never stop
  setInterval(addCardThumb, 800);

  // ---- loading screen: the FIRST PAGE's gifs must finish before entry ---
  // Measured 2026-09-23: blocking on all six gifs + the closing card was
  // ~5.3MB before the deck would open. Only slide 1's three gifs are on
  // screen at entry, so only those block (~3.3MB); everything else starts
  // downloading the moment the gate opens and is almost always there long
  // before the user reaches it (each later page has at most one or two
  // gifs, 0.3–0.7MB each). The gate still NEVER times out into the deck —
  // it only waits for less. The big per-slide PDFs never blocked.
  var GIF_URLS_FIRST = [
    'assets/22CB59BC-9A28-4AEC-948E-FE2BBE837FCB/assets/P2-PRK.gif-0.0000-16.8600.gif',
    'assets/22CB59BC-9A28-4AEC-948E-FE2BBE837FCB/assets/P3-LASIK.gif-0.0000-17.9400.gif',
    'assets/22CB59BC-9A28-4AEC-948E-FE2BBE837FCB/assets/P4-SMILE.gif-0.0000-15.0900.gif'
  ];
  var GIF_URLS_REST = [
    'assets/6F80DFBD-9A36-44E4-92EE-B3EA7E1CA1E2/assets/P3-眼球吸附.gif-0.0000-17.5800.gif',
    'assets/A020B5BA-42E6-4B54-90AC-B5DF2E7A1D61/assets/P4-近視雷射手術第二階段 穩定恢復期 .gif-0.0000-7.2000.gif',
    'assets/A020B5BA-42E6-4B54-90AC-B5DF2E7A1D61/assets/P5-近視雷射手術第二階段 不穩定恢復期.gif-0.0000-4.5000.gif'
  ];
  var GIF_URLS = GIF_URLS_FIRST.concat(GIF_URLS_REST);  // ?r=1 warming still covers all six
  var CRITICAL_ASSETS = GIF_URLS_FIRST.slice();
  window.__gifWarm = []; // live refs so the decoded gifs can't be evicted

  var overlay = document.createElement('div');
  overlay.id = '__preload';
  applyStyles(overlay, {
    position:'fixed', top:'0', left:'0', right:'0', bottom:'0', zIndex:'99999',
    background:'#EDF7F9', display:'flex', flexDirection:'column',
    alignItems:'center', justifyContent:'center',
    fontFamily:'-apple-system, "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif'
  });
  var oTitle = document.createElement('div');
  oTitle.textContent = '近視雷射手術衛教';
  applyStyles(oTitle, { fontSize:'26px', fontWeight:'700', color:'#3a5f7d', marginBottom:'26px', letterSpacing:'.02em' });
  var barOuter = document.createElement('div');
  applyStyles(barOuter, { width:'240px', height:'8px', borderRadius:'999px', background:'rgba(58,95,125,0.15)', overflow:'hidden' });
  var barInner = document.createElement('div');
  applyStyles(barInner, { width:'0%', height:'100%', background:'#4578bf', transition:'width .2s ease' });
  barOuter.appendChild(barInner);
  var oPct = document.createElement('div');
  oPct.textContent = '動畫載入中 0%';
  applyStyles(oPct, { marginTop:'14px', fontSize:'14px', color:'#6b8aa0' });
  overlay.appendChild(oTitle); overlay.appendChild(barOuter); overlay.appendChild(oPct);
  document.body.appendChild(overlay);

  (function gateOnGifs(){
    var total = CRITICAL_ASSETS.length, done = 0, closed = false;

    function render(){
      var pct = Math.round((done / total) * 100);
      barInner.style.width = pct + '%';
      oPct.textContent = '動畫載入中 ' + pct + '%';
    }
    function openGate(){
      if (closed) return;
      closed = true;
      // Hold the gate (bar sits at 100%) until slide 1 has actually
      // rendered, so the user NEVER sees an intermediate spinner — the
      // progress screen hands off directly to the tutorial / the deck.
      oPct.textContent = '準備中…';
      var t0 = Date.now();
      // The gate must NEVER open onto an unrendered stage. On a cold load
      // (incognito / first visit) the player still has to download its own
      // 1.2MB main.js and slide 1's PDF, which can take much longer than
      // the gifs — an earlier build gave up waiting after 10s and handed
      // the user a blank screen behind the tutorial. So: wait for the
      // canvas for as long as it takes, say so after 8s, and only offer a
      // reload if it is clearly not coming (60s).
      (function waitFirstSlide(){
        if (!document.querySelector('#stage canvas')){
          var waited = Date.now() - t0;
          if (waited > 60000){
            oPct.textContent = '投影片載入異常，請重新整理';
            if (!document.getElementById('__reloadBtn')){
              var btn = document.createElement('div');
              btn.id = '__reloadBtn';
              btn.textContent = '重新整理';
              applyStyles(btn, {
                marginTop:'18px', fontSize:'15px', padding:'10px 26px', borderRadius:'999px',
                border:'1px solid rgba(58,95,125,0.45)', color:'#3a5f7d', cursor:'pointer'
              });
              btn.addEventListener('click', function(){ location.reload(); });
              overlay.appendChild(btn);
            }
          } else if (waited > 8000){
            oPct.textContent = '首次載入投影片，請稍候…';
          }
          setTimeout(waitFirstSlide, 150);
          return;
        }
        overlay.style.transition = 'opacity .3s ease';
        overlay.style.opacity = '0';
        setTimeout(function(){
          overlay.parentNode && overlay.parentNode.removeChild(overlay);
          maybeShowTutorial(); // first-run only (localStorage)
        }, 320);
        warmRestInBackground();
      })();
    }
    function loadOne(url, attempt){
      var im = new Image();
      im.onload = function(){
        window.__gifWarm.push(im); // decoded + pinned
        done++; render();
        if (done >= total) openGate();
      };
      im.onerror = function(){
        if (attempt < 5){
          oPct.textContent = '網路不穩，重試中…';
          setTimeout(function(){ loadOne(url, attempt + 1); }, 1200 * attempt);
        } else {
          oPct.textContent = '動畫載入失敗，請檢查網路後重新整理';
        }
      };
      im.src = encodeURI(url);
    }

    render();
    CRITICAL_ASSETS.forEach(function(u){ loadOne(u, 1); });
  })();

  // Non-blocking: warm the remaining slides' PDFs + thumbnails after entry
  // so later page turns are fast too. Failures are harmless (the player
  // fetches on demand as a fallback).
  // Also warm the ?r=1 alternate GIF URLs used by the ping-pong restart.
  function warmRestInBackground(){
    // First the assets that were taken off the gate, in the order the user
    // will meet them: slide 2's gif, slide 5's two, then the closing card.
    ensureCardImg();                       // the card element starts loading now
    GIF_URLS_REST.forEach(function(u){
      var im = new Image();
      im.src = encodeURI(u);
      window.__gifWarm.push(im); // decoded + pinned
    });
    // Then the ?r=1 alternates used by the ping-pong restart.
    GIF_URLS.forEach(function(u){
      var im = new Image();
      im.src = encodeURI(u) + '?r=1';
      window.__gifWarm.push(im); // pin in memory
    });
    var uuids = [
      '6F80DFBD-9A36-44E4-92EE-B3EA7E1CA1E2',
      'FAD1F8D5-3D72-4B24-9EE6-220209CA7A22',
      '515BF58C-A7F4-42C7-AB24-F395E442BD09',
      'A020B5BA-42E6-4B54-90AC-B5DF2E7A1D61'
    ];
    var urls = [];
    uuids.forEach(function(u){ urls.push('assets/' + u + '/thumbnail.jpeg'); });
    uuids.forEach(function(u){ urls.push('assets/' + u + '/assets/' + u + '.pdf'); });
    var idx = 0;
    function next(){
      if (idx >= urls.length) return;
      var u = urls[idx++];
      fetch(encodeURI(u)).catch(function(){}).then(function(){ next(); });
    }
    next(); next(); // concurrency 2
  }
})();
</script>
</body></html>
